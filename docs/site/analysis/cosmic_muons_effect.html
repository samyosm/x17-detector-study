      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "55cc229537a3b92c772d88d5b56bbf88", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "68bd0e93dc575100dd42c15e2adb7c69", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"cosmic-muon-coincidences\"\u003ECosmic-muon coincidences\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EH. Benmansour et al., \u003Ca href=\"https://arxiv.org/abs/2609.18383v1\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\u003Cem\u003EOn the importance of cosmic-ray background in the\nAtomki anomaly\u003C/em\u003E\u003C/a\u003E, arXiv:2609.18383v1 (2026),\nshow that cosmic muons can produce angular peaks in simulated five- and six-arm\npair spectrometers. Detector geometry and deposited-energy selections shape\nthese peaks, potentially imitating features attributed to X17.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EWe apply their analysis to our sixteen-arm detector to estimate how often\nmuons pass the pair selection and whether they create similar structure.\nA muon crossing two arms can be reconstructed as two particles leaving the\ntarget. We follow that reconstruction from deposited energy to opening angle,\nthen estimate the background over an experimental exposure. The different\ngeometry means the paper's peak positions and rates need not carry over.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "48c2b4bec74af970a7d4fb8442373f1e", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='vblA-2' random-id='256e46be-34b8-3d13-c22e-99cc30edf582'\u003E\u003Cmarimo-form data-initial-value='null' data-label='null' data-element-id='\u0026quot;vblA-1\u0026quot;' data-loading='false' data-bordered='true' data-submit-button-label='\u0026quot;Submit\u0026quot;' data-submit-button-disabled='false' data-clear-on-submit='false' data-show-clear-button='false' data-clear-button-label='\u0026quot;Clear\u0026quot;' data-should-validate='false'\u003E\u003Cmarimo-ui-element object-id='vblA-1' random-id='cfaf4a45-5ab7-0b8a-df87-fc7c54a2bd80'\u003E\u003Cmarimo-text data-initial-value='\u0026quot;data/cosmic_muons_1M_seed1729_23sept2026-02.root\u0026quot;' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eROOT file\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-kind='\u0026quot;text\u0026quot;' data-full-width='true' data-disabled='false' data-debounce='true'\u003E\u003C/marimo-text\u003E\u003C/marimo-ui-element\u003E\u003C/marimo-form\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-ui-element object-id='vblA-3' random-id='d04d9deb-9d82-d444-5613-5fcbf9677a65'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;5\u00b0\u0026quot;]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eAngular bins\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-options='[\u0026quot;2\u00b0\u0026quot;,\u0026quot;5\u00b0\u0026quot;,\u0026quot;10\u00b0\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false' data-disabled='false'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "677d1f28db47087577b20e0fc05ac0c4", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "085c07831595c808a67c2426b980324b", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"from-incident-muons-to-detector-hits\"\u003EFrom incident muons to detector hits\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe selected run contains \u003Cstrong\u003E1,000,000 incident muons\u003C/strong\u003E out of\n1,000,000 requested events, with \u003Cstrong\u003E16 detector arms\u003C/strong\u003E.\nIts source is a 200 cm square at\ny = 60 cm, with zenith angles up to\n70\u00b0 and kinetic energies from\n0.1 to 100 GeV.\nThese settings and the geometry are taken from the saved run records.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEach arm combines a long scintillator, a thin \u0394E scintillator, and a matching\nangular sector of the multiwire proportional chamber (MWPC). All three\ndeposits must exceed their thresholds for the arm to count as hit.\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003ELayer\u003C/th\u003E\n\u003Cth style=\"text-align: right;\"\u003EDeposit must exceed\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EMWPC gas\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E1 keV\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EThin \u0394E scintillator\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E50 keV\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003ELong scintillator\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E100 keV\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EThese are ideal energy-deposit requirements; electronics resolution and\ncoincidence timing are not modelled. The hit counts already incorporate\nthese thresholds. Testing other thresholds requires recalculating the hits\nfrom the individual arm deposits.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7d69f0ca7ccb30cce55dcdedcbf7bc35", "console": [], "id": "PKri", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "16bdc0aaf33d1bdd5164af96538066ea", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"selecting-two-arm-coincidences\"\u003ESelecting two-arm coincidences\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe number of hit arms is the event's \u003Cem\u003Emultiplicity\u003C/em\u003E. We retain events with\nexactly two hit arms, giving \u003Cstrong\u003E12 coincidences\u003C/strong\u003E and an\nefficiency of \u003Cstrong\u003E0.0012%\u003C/strong\u003E.\nEfficiency is the selected count divided by all generated muons, including\nthose that miss the detector.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EOf these coincidences, \u003Cstrong\u003E0\u003C/strong\u003E have undefined energy or angle\nvalues and are excluded from subsequent distributions. They remain included\nin the trigger count. The multiplicity distribution below shows how often\nan incident muon produces each number of hit arms.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "bf1d908dbd75ec54618fba58198a301e", "console": [], "id": "SFPL", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='SFPL-0' random-id='019319be-7977-d646-d3fb-ea2d3ba0a393'\u003E\u003Cmarimo-matplotlib data-initial-value='{}' data-label='null' data-chart-base64='\u0026quot;data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAyAAAAFeCAYAAAB9x3vwAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjEsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvctoD+AAAAAlwSFlzAAAPYQAAD2EBqD+naQAANflJREFUeJzt3Qd0FGXbxvE7EEhoCYReQu+gFJGOFIVQBOkgggjIa+WlKEpTQFBAUVERFUWlSZcivfPSQkeaIL1DQHoJdb5zP+fsftmQhEWSyST5/87Zk+zsTPbJbJm55mk+lmVZAgAAAAA2SGbHkwAAAAAAAQQAAACAragBAQAAAGCbJBVA e detector centre as the assumed vertex and share the same data, bins, and\ncolour scale. The highlighted bands identify the signal and control windows\nused in the comparisons that follow.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a45796e13f7a2365d8665ab76dd9232a", "console": [], "id": "nWHF", "outputs": [{"data": {"text/html": "\u003Cmarimo-mime-renderer data-mime='\u0026quot;application/vnd.marimo+mimebundle\u0026quot;' data-data='\u0026quot;{\u0026#92;\u0026quot;image/png\u0026#92;\u0026quot;: \u0026#92;\u0026quot;data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACKkAAAM3CAYAAAD8kpHEAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjEsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvctoD+AAAAAlwSFlzAAAewgAAHsIBbtB1PgABAABJREFUeJzs3QeYU2XaxvFnhqFXUXoVARuIiCCCuqgICioiKthwFaxrwQpW7CyiIusqFooVUVCwARbs0hQQUVRQQOkovQ1lJt91v34nG0KSycwkZ0r+v73OlTA5yTkp48775n6fJy0QCAQMAAAAAAAAAAAAAAAASKL0ZD44AAAAAAAAAAAAAAAAIIRUAAAAAAAAAAAAAAAAkHSEVAAAAAAAAAAAAAAAAJB0hFQAAAAAAAAAAAAAAACQdIRUAAAAAAAAAAAAAAAAkHSEVAAAAAAAAAAAAAAAAJB0hFQAAAAAAAAAAAAAAACQdIRUAAAAAAAAAAAAAAAAkHSEVAAAAAAAAAAAAAAAAJB0hFQAAAAAAAAAAAAAAACQdIRUAAAAAAAAAAAAAAAAkHSEVAAAAAAAAAAAAAAAAJB0hFQAAAAAAAAAAAAAAACQdIRUAAAAAAAAAAAAAAAAkHSEVAAAAAAAAAAAAAAAAJB0hFQAAAAAAAAAAAAAAACQdIRUAAAAAAAAAAAAAAAAkHSEVAAAAAAAAAAAAAAAAJB0Gck/BAqrrKws27Jli23bts0yMzMtOzu7oE8JAAqNEiVKWPny5a1SpUpWtmzZgj4dAACAlMb4FQCQG4zpAQAAgMIrLRAIBAr6JOA/hVKWL19uu3fv5uUHgBzUrl3bKleuzOsEAABQABi/AgDygzE9AAAAULhQSSUF7dmzx5YuXWqh+aS0tDS3wgAA8L//VnpWrlxppUuXtjJlyvDyAAAA+IjxKwAgr///4WFMDwAAABQuhFRS0MaNG4MBFbWwqF69urtUUAUA8L+S8qtXr7bNmze7f2/atImQCgAAgM8YvwIA8oIxPQAAAFB4pRf0CcB/W7ZsCV6vU6eOlStXjoAKAIRRdamaNWsG/71t2zZeIwAAAJ8xfgUA5AVjegAAAKDwIqSSwuUuNVgrWbJkQZ8OABRa+u9kRkZGcBUWAAAA/MX4FQCQV4zpAQAAgMKJkEoKo70PAAAAAKAoYPwKAAAAAABQPBBSAQAAAAAAAAAAAAAAQNIRUgEAAAAAAAAAAAAAAEDSEVIBAAAAAAAAAAAAAABA0mUk/xAoitZszrQ92QErqjLS06xGpTIJe7znnnvOVq5cuc/Py5QpY7Vq1bLjjjvODjroICvMnnjiCdu4caNdddVVVrNmTSuqkvk8MjMzbcaMGW7T9fr169tll12Wq8eYO3euzZo1yzZs2ODuf8wxxyT0s7F9+3abPn26/f7777Z69 FcAAAAAAAAKWLDIwgAAAAAAAO2d4AoAAAAAAEABgisAAAAAAAAFCK4AAAAAAAAUILgCAAAAAABQgOAKAAAAAABAAYIrAAAAAAAABQiuAAAAAAAAFCC4AgAAAAAAUIDgCgAAAAAAQAGCKwAAAAAAAAUIrgAAAAAAABQguAIAAAAAAFCA4AoAAAAAAEABgisAAAAAAAAFCK4AAAAAAAAUILgCAAAAAABQgOAKAAAAAABAAYIrAAAAAAAAWf3+PzcxeByJQEzNAAAAAElFTkSuQmCC\u0026#92;\u0026quot;, \u0026#92;\u0026quot;__metadata__\u0026#92;\u0026quot;: {\u0026#92;\u0026quot;image/png\u0026#92;\u0026quot;: {\u0026#92;\u0026quot;width\u0026#92;\u0026quot;: 812, \u0026#92;\u0026quot;height\u0026#92;\u0026quot;: 412}}}\u0026quot;'\u003E\u003C/marimo-mime-renderer\u003E"}, "type": "data"}]}, {"code_hash": "55ce457da18f546268dd22c843d2535b", "console": [], "id": "ecfG", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"from-selected-counts-to-an-exposure-estimate\"\u003EFrom selected counts to an exposure estimate\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EIf n of N incident muons pass a selection, its estimated efficiency is n / N.\nThe table reports this fraction and a \u003Cstrong\u003E95% Wilson binomial confidence\ninterval\u003C/strong\u003E. Unlike a simple symmetric error bar, this interval gives a\nnonzero upper bound even when no events survive. It describes counting\nuncertainty in the simulation; it does not include uncertainty in the source\nor detector model.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETo estimate an experimental yield, multiply the efficiency by the expected\nnumber of incident muons. Adopting the study's assumed rate of \u003Cstrong\u003E700 muons/s\u003C/strong\u003E\nfor \u003Cstrong\u003E300 hours\u003C/strong\u003E gives 756 million incident muons. Each simulated event\ntherefore carries a weight of 756 million / N in the exposure-scaled plots.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis rate is an external assumption, not a measurement of our setup.\nScaling the sample changes its predicted yield but does not improve its\nstati eaders='[]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "924a85ba1870ead38ef7397a3ca55b2e", "console": [], "id": "aLJB", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"predicted-cosmic-spectra\"\u003EPredicted cosmic spectra\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EApplying the exposure weight gives the cosmic energy and angular spectra\nbelow. The energy spectrum includes all two-arm coincidences; the angular\nspectra additionally require symmetric energy sharing in the beryllium windows.\nError bars are the event weight times the square root of the simulated bin\ncount, a Poisson approximation to Monte Carlo counting uncertainty. For empty\nselections, use the confidence interval in the table rather than a zero error bar.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEstimating the cosmic fraction of an experimental pair sample also requires\nthe nuclear background from internal pair conversion (IPC). That comparison\nneeds a validated IPC model and its absolute reaction rate. This analysis\nestimates the cosmic contribution alone; the current simplified IPC source\ndoes not reproduce the study's full Zhang\u2013Miller calculation.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a1d71d33b184378b567440d85f5aa197", "console": [], "id": "nHfw", "outputs": [{"data": {"text/html": "\u003Cmarimo-mime-renderer data-mime='\u0026quot;application/vnd.marimo+mimebundle\u0026quot;' data-data='\u0026quot;{\u0026#92;\u0026quot;image/png\u0026#92;\u0026quot;: \u0026#92;\u0026quot;data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABlcAAAcfCAYAAAC/0aWgAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjEsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvctoD+AAAAAlwSFlzAAAewgAAHsIBbtB1PgABAABJREFUeJzs3Ql0U9W+x/F/05bOLaWFAgJlvFcBQbwyCCKjDCKKI console": [], "id": "xXTn", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"interpreting-the-background\"\u003EInterpreting the background\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe coincidence efficiency sets the overall rate. The energy\u2013angle maps and\narm separations explain its shape, while the energy, asymmetry, and vertex\ncomparisons reveal how the final selection changes it. Together these checks\ndistinguish a broad cosmic contribution from one concentrated in a candidate\nsignal region.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA small or empty selected sample limits what can be concluded. More independent\nsimulated events improve counting precision; beam-off data test whether the\npredicted rates and shapes describe the real detector. The practical criterion\nis whether the validated cosmic contribution lies below the experiment's\nacceptable background in its final signal selection.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.24.0", "script_metadata_hash": null}, "version": "1"},
