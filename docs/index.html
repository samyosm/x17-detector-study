<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Seven views of the X17 detector: scintillators, chamber, ΔE detectors and target assembly.">
  <title>X17 detector</title>
  <link rel="stylesheet" href="site/styles.css">
</head>
<body>
  <main>
    <header><h1>X17 detector</h1><p>Geometry, from the outside in.</p></header>
    <div class="views">
      <figure>
        <a href="site/assets/detector/whole.png" aria-label="Open full-size view: Detector">
          <img src="site/assets/detector/whole.png" alt="Green cylindrical PVC enclosure surrounding the detector." width="900" height="700" decoding="async">
        </a>
        <figcaption><h2>Detector</h2><p>The full assembly inside its PVC enclosure.</p></figcaption>
      </figure>
      <figure>
        <a href="site/assets/detector/bars.png" aria-label="Open full-size view: Scintillator bars">
          <img src="site/assets/detector/bars.png" alt="Sixteen cyan trapezoidal scintillator bars arranged around the beam axis." width="900" height="700" decoding="async">
        </a>
        <figcaption><h2>Scintillator bars</h2><p>Sixteen long scintillators, with the enclosure hidden.</p></figcaption>
      </figure>
      <figure>
        <a href="site/assets/detector/beam_axis.png" aria-label="Open full-size view: Along the beam">
          <img src="site/assets/detector/beam_axis.png" alt="The scintillator barrel viewed nearly along the beam axis." width="900" height="700" loading="lazy" decoding="async">
        </a>
        <figcaption><h2>Along the beam</h2><p>A view into the scintillator barrel.</p></figcaption>
      </figure>
      <figure>
        <a href="site/assets/detector/central.png" aria-label="Open full-size view: Inner assembly">
          <img src="site/assets/detector/central.png" alt="Black PLA housings surrounding the cylindrical chamber and beam assembly." width="900" height="700" loading="lazy" decoding="async">
        </a>
        <figcaption><h2>Inner assembly</h2><p>ΔE housings around the chamber and beam pipe.</p></figcaption>
      </figure>
      <figure>
        <a href="site/assets/detector/delta_e.png" aria-label="Open full-size view: ΔE detectors">
          <img src="site/assets/detector/delta_e.png" alt="Sixteen cyan thin scintillators surrounding the chamber." width="900" height="700" loading="lazy" decoding="async">
        </a>
        <figcaption><h2>ΔE detectors</h2><p>Sixteen thin scintillators, with their housings hidden.</p></figcaption>
      </figure>
      <figure>
        <a href="site/assets/detector/housing.png" aria-label="Open full-size view: Inside a housing">
          <img src="site/assets/detector/housing.png" alt="A single housing and its air cavity shown as wireframes around a cyan scintillator." width="900" height="700" loading="lazy" decoding="async">
        </a>
        <figcaption><h2>Inside a housing</h2><p>Black PLA, white air cavity, cyan scintillator.</p></figcaption>
      </figure>
      <figure>
        <a href="site/assets/detector/target.png" aria-label="Open full-size view: Target &amp; supports">
          <img src="site/assets/detector/target.png" alt="Small LiF target beside its long copper cooling tube and brass nut." width="900" height="700" loading="lazy" decoding="async">
        </a>
        <figcaption><h2>Target &amp; supports</h2><p>LiF target, hollow copper cooling tube and brass nut.</p></figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
