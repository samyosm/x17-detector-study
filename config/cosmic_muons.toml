[runtime]
mode = "batch"
threads = 20
events = 100_000_000
progress_interval = 100000
output_file = "data/cosmic_muons_100M_seed1729_23sept2026-01.root"
random_seed = 1729

[visualization]
macro = "../macros/figures/whole.mac"

[source.cosmic_muons]

enable = true
positive_fraction = 0.5

[source.cosmic_muons.plane]

side_cm = 200.0
height_cm = 60.0

[source.cosmic_muons.angular]

zenith_max_deg = 70.0
power = 1.0
nodes = 128

[source.cosmic_muons.energy]

min_gev = 0.1
max_gev = 100.0
nodes = 2048

[optics]
enable = false

[readout]
record_steps = true

[readout.thresholds]

mwpc_mev = 0.001
delta_e_mev = 0.05
scintillator_mev = 0.1

[geometry]
file = "../geometry/world.gdml"
