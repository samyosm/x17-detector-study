[runtime]
mode = "visualization"
threads = 20
events = 100_000
progress_interval = 1000
output_file = "data/official_geometry_100k_mixed.root"

[visualization]
macro = "../macros/figures/whole.mac"

[source.ipc]
enable = true

[source.x17]

enable = true
mass_mev = 17.0
fraction = 0.05

[source.pair]
transition_energy_mev = 18.15

[source.gun]
enable = false
particle = "geantino"
energy_mev = 1.0
position_cm = [0.0, 0.0, 0.0]
direction = [0.0, 0.0, 1.0]

[source.cosmic_muons]

enable = false

[optics]
enable = true

[optics.scintillator]
emission_min_ev = 2.5
emission_max_ev = 3.5
yield_per_mev = 1000.0
resolution_scale = 1.0
decay_ns = 2.1
refractive_index = 1.58
absorption_length_cm = 200.0

[optics.air]
refractive_index = 1.0003

[optics.sensor]
quantum_efficiency = 0.25

[geometry]
file = "../geometry/world.gdml"
