[physics]
em_option = "option4"
default_cut_mm = 0.7
capsule_cut_mm = 0.01
atomic_deexcitation = true

[source.cosmic_muons]
model = "guan"
positive_fraction = 0.5

[source.cosmic_muons.plane]
side_cm = 200.0
height_cm = 60.0

[source.cosmic_muons.angular]
zenith_max_deg = 70.0
nodes = 128

[source.cosmic_muons.energy]
min_gev = 0.1
max_gev = 100.0
nodes = 2048

[optics]
enable = true

[optics.scintillator]
emission_min_ev = 2.5
emission_max_ev = 3.5
yield_per_mev = 10000.0
resolution_scale = 1.0
decay_ns = 2.1
refractive_index = 1.58
absorption_length_cm = 200.0

[optics.wrap]
reflectivity = 0.95

[optics.air]
refractive_index = 1.0003

[optics.sensor]
quantum_efficiency = 0.25

[readout.raw_hits]
enable = true
window_ns = 10.0

[readout.vf48]
adc_per_photoelectron = 1.0
event_period_ns = 1.0e7
time_resolution_ns = 0.25

[geometry]
version = "unversioned; identified by the recorded fingerprint"
file = "../geometry/world.gdml"
