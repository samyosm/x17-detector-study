[runtime]
mode = "batch"
threads = 20
events = 10_000_000
checkpoint_events = 1_000_000
progress_interval = 1000000
output_file = "data/cosmic_muons_b4_10M_seed1729.root"
random_seed = 1729

[visualization]
macro = "../macros/figures/whole.mac"

[source.cosmic_muons]

enable = true
model = "b4"
positive_fraction = 1.0

[source.cosmic_muons.plane]

x_cm = 20.0
z_cm = 30.0
height_cm = 45.0

[source.cosmic_muons.angular]

zenith_max_deg = 70.0

[source.cosmic_muons.energy]

min_gev = 0.1
max_gev = 20.0

[optics]
enable = false

[readout]
record_steps = false

[readout.thresholds]

mwpc_mev = 0.001
delta_e_mev = 0.05
scintillator_mev = 0.1

[geometry]
file = "../geometry/world.gdml"
